[package]
name = "asr-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Captura WASAPI (loopback y microfono) entregada como 16 kHz mono f32 para ASR"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustfft = "6"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23.0"

# Core Audio va por FFI propia; objc2 solo para CATapDescription y para armar
# el diccionario del dispositivo agregado del tap.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
