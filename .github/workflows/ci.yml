name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Frontend (tsc + vite)
        run: |
          npm ci
          npm run build

      # tauri-build exige que existan todos los recursos del bundle, incluido
      # asr-cli.exe de release. Para los tests basta con que el fichero exista;
      # compilarlo en release solo para esto doblaria el tiempo.
      - name: Placeholder for the bundled asr-cli.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release | Out-Null
          if (-not (Test-Path target/release/asr-cli.exe)) { New-Item -ItemType File target/release/asr-cli.exe | Out-Null }

      - name: Rust tests
        run: cargo test --workspace --locked

  # Port a macOS: que compile y pasen los tests, para no romperlo sin darnos
  # cuenta. La captura de macOS (Core Audio, crates/asr-audio/src/coreaudio.rs)
  # se compila aqui, pero el runner no tiene audio: no se prueba en vivo.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Frontend (tsc + vite)
        run: |
          npm ci
          npm run build

      # El bundle declara asr-cli.exe (el de Windows) como recurso y tauri-build
      # exige que exista; para compilar y probar basta un fichero vacio.
      - name: Placeholder for the bundled asr-cli.exe
        run: |
          mkdir -p target/release
          touch target/release/asr-cli.exe

      - name: Rust tests
        run: cargo test --workspace --locked
