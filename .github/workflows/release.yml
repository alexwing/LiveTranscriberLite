name: Release

# Un tag v* (p. ej. v0.1.0) compila la app para Windows y macOS y deja una
# release en BORRADOR con el instalador NSIS, el MSI, un zip portable y el .dmg
# de macOS (Apple Silicon). Se publica a mano tras revisarla. La version sale de src-tauri/tauri.conf.json, que tiene que
# coincidir con el tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # En una PR que toca el empaquetado solo se compila el .dmg, para ver que
  # sale; no se crea ni se toca ninguna release.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.macos.conf.json
      - src-tauri/Info.plist

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con la version de tauri.conf.json (v$version)"
          }

      # asr-cli.exe va dentro del bundle como recurso, asi que tiene que existir
      # antes de `tauri build`.
      - name: Build asr-cli
        run: cargo build -p asr-cli --release --locked

      - name: Build app and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: LiveTranscriber Lite v__VERSION__
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Transcripcion en vivo de reuniones en espanol e ingles (microfono + audio del sistema), en local, con Parakeet TDT 0.6B v3.

            **Instalacion**
            1. Instala `LiveTranscriber.Lite_*_x64-setup.exe` (o el `.msi`).
            2. Abre la app. La primera vez se prepara sola (runtime de Visual C++, Python y el modelo de voz, ~1 GB) y lo cuenta en la ventana; Windows puede pedir permiso de administrador una vez. Para la GPU, despues ejecuta `install.cmd -Gpu` desde la carpeta de instalacion.

            El `.zip` portable trae lo mismo sin instalador: descomprimelo y abre `LiveTranscriberLite.exe`.

            Windows 10/11 x64.

            **macOS (Apple Silicon, en pruebas)**
            1. Abre `LiveTranscriberLite_*_aarch64.dmg` y arrastra la app a Aplicaciones.
            2. La app no esta firmada por Apple: la primera vez macOS no la deja abrir. Ve a Ajustes del Sistema > Privacidad y seguridad y pulsa «Abrir igualmente».
            3. Se prepara sola igual que en Windows (Python y el modelo de voz) y pide permiso para el microfono y para grabar el audio del sistema. El audio del sistema necesita macOS 14.2 o posterior.

      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $name = "LiveTranscriberLite_${version}_x64_portable"
          $out = "portable/$name"
          New-Item -ItemType Directory -Force "$out/sidecar", "$out/scripts/fixtures" | Out-Null
          $exe = Get-ChildItem target/release -Filter *.exe | Where-Object { $_.Name -ne "asr-cli.exe" -and $_.Name -notlike "build-script*" } | Select-Object -First 1
          if (-not $exe) { throw "no encuentro el ejecutable de la app en target/release" }
          Copy-Item $exe.FullName "$out/LiveTranscriberLite.exe"
          Copy-Item target/release/asr-cli.exe $out
          Copy-Item sidecar/asr_server.py, sidecar/requirements.txt "$out/sidecar"
          Copy-Item scripts/install.ps1, scripts/verify.ps1, scripts/fetch_models.py, scripts/smoke_test.py "$out/scripts"
          Copy-Item scripts/fixtures/*.wav "$out/scripts/fixtures"
          Copy-Item install.cmd, README.md, LICENSE, transcriber-config.example.toml $out
          Compress-Archive -Path "$out/*" -DestinationPath "portable/$name.zip"
          "ZIP=portable/$name.zip" >> $env:GITHUB_ENV

      - name: Upload portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.tauri.outputs.appVersion }}" "$env:ZIP" --clobber

  # macOS: solo la app y el .dmg. asr-cli.exe es de Windows y la config de
  # macOS (src-tauri/tauri.macos.conf.json) lo quita del bundle. Se compila en
  # paralelo con Windows y el .dmg se sube a la release cuando esa ya existe.
  macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: App version
        id: version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "El tag ${{ github.ref_name }} no coincide con la version de tauri.conf.json (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build app and dmg
        run: npx tauri build --bundles app,dmg

      - name: Check the bundle
        run: |
          app="$(ls -d target/release/bundle/macos/*.app | head -n 1)"
          res="$app/Contents/Resources"
          test -f "$res/scripts/install.sh"
          test -f "$res/sidecar/asr_server.py"
          test ! -e "$res/asr-cli.exe"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSAudioCaptureUsageDescription" "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"

      - name: Rename dmg
        run: |
          dmg="$(ls target/release/bundle/dmg/*.dmg | head -n 1)"
          mkdir -p out
          cp "$dmg" "out/LiveTranscriberLite_${{ steps.version.outputs.version }}_aarch64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: out/*.dmg
          if-no-files-found: error

  macos-upload:
    if: github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: out

      - name: Upload dmg to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.macos.outputs.version }}" out/*.dmg --clobber --repo "${{ github.repository }}"
